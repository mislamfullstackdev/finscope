spring.application.name=finscope

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/finscope
spring.datasource.username=finscope
spring.datasource.password=finscope
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true